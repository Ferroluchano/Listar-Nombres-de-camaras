<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de Archivos .scp en "Client Files"</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; margin-bottom: 20px; }
        input, button { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        pre { background: #f8f9fa; padding: 15px; border: 1px solid #ddd; border-radius: 4px; max-height: 350px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h2>Extractor de .scp en carpetas "Client Files"</h2>
    
    <label for="folderInput">**1. Selecciona la carpeta principal:**</label>
    <!-- webkitdirectory permite seleccionar una carpeta completa -->
    <input type="file" id="folderInput" webkitdirectory directory multiple>

    <button onclick="processFolder()">Buscar y Procesar Archivos</button>
</div>

<div class="container">
    <h3>Resultado Formateado:</h3>
    <pre id="output">Los resultados aparecerán aquí...</pre>
    
    <button class="btn-success" onclick="downloadResults()">Descargar Resultados en TXT</button>
</div>

<script>
    let lastResults = '';

    async function processFolder() {
        const folderInput = document.getElementById('folderInput');
        const outputPre = document.getElementById('output');
        
        outputPre.textContent = '';

        if (folderInput.files.length === 0) {
            alert('Por favor, selecciona una carpeta.');
            return;
        }

        let results = '';
        const regex = /<Name>([\s\S]*?)<\/Name>/gi;
        let matchedFilesCount = 0;

        // Recorrer todos los archivos dentro de la carpeta y subcarpetas seleccionadas
        for (const file of folderInput.files) {
            // Dividir la ruta relativa en partes para verificar los nombres de las carpetas
            const pathParts = file.webkitRelativePath.split('/');
            
            // Verificar si alguna de las carpetas en la ruta se llama exactamente "Client Files" (ignorando mayúsculas/minúsculas)
            const isInClientFiles = pathParts.some(part => part.toLowerCase() === 'client files');
            // Verificar que el archivo termine en .scp (ignorando mayúsculas/minúsculas)
            const isScp = file.name.toLowerCase().endsWith('.scp');

            if (isInClientFiles && isScp) {
                matchedFilesCount++;
                try {
                    const text = await file.text();
                    let names = [];
                    let match;

                    // Extraer todos los nombres entre <Name> y </Name>
                    while ((match = regex.exec(text)) !== null) {
                        const cleanName = match[1].trim();
                        if (cleanName) {
                            names.push(cleanName);
                        }
                    }

                    // Formato solicitado: Guión al inicio, nombre del archivo y los nombres separados por coma y espacio
                    const formattedNames = names.length > 0 ? names.join(', ') : '(Sin etiquetas <Name> encontradas)';
                    results += `- ${file.webkitRelativePath}: ${formattedNames}\n`;

                } catch (error) {
                    results += `- ${file.webkitRelativePath}: Error al leer el archivo (${error.message})\n`;
                }
            }
        }

        if (matchedFilesCount === 0) {
            results = 'No se encontraron archivos .scp dentro de ninguna carpeta llamada "Client Files".';
        }

        lastResults = results;
        outputPre.textContent = results;
    }

    function downloadResults() {
        if (!lastResults) {
            alert('Primero debes procesar una carpeta.');
            return;
        }
        const blob = new Blob([lastResults], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'client_files_nombres.txt';
        a.click();
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
